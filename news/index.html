<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お知らせ | 訪問看護ステーション フィルケア</title>
  <meta name="description" content="宇治市・城陽市・久御山町・伏見区の精神科訪問看護ステーション フィルケアからのお知らせ。訪問看護の利用方法、自立支援医療などの制度解説、営業案内を掲載しています。">

  <link rel="icon" type="image/png" href="../favicon.png">
  <meta property="og:type" content="article">
  <meta property="og:title" content="お知らせ | 訪問看護ステーション フィルケア">
  <meta property="og:description" content="宇治市・城陽市・久御山町・伏見区の精神科訪問看護ステーション フィルケアからのお知らせ。訪問看護の利用方法、自立支援医療などの制度解説、営業案内を掲載しています。">

  <meta property="og:locale" content="ja_JP">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:        #F7F9F7;
      --bg-sec:    #DCEFE2;
      --accent:    #8FBF9A;
      --accent-dk: #6FAF7D;
      --accent-lt: #b8d8bf;
      --accent-pl: #eaf5ec;
      --text:      #4A4A4A;
      --text-lt:   #7a8a7e;
      --heading:   #8FBF9A;
      --white:     #ffffff;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 200;
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem;
      background: rgba(247,249,247,.96);
      backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid rgba(143,191,154,.2);
      box-shadow: 0 2px 16px rgba(0,0,0,.04);
    }
    .nav-logo {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.15rem; font-weight: 500; color: var(--accent-dk);
      text-decoration: none; letter-spacing: .04em;
      display: flex; align-items: center; gap: .5rem;
    }
    .nav-logo-img { height: 28px; width: auto; object-fit: contain; }
    .nav-back {
      font-size: .78rem; color: var(--text-lt); text-decoration: none;
      display: flex; align-items: center; gap: .4rem;
      padding: .4rem .9rem; border-radius: 980px;
      border: 1px solid rgba(143,191,154,.35);
      transition: all .2s;
    }
    .nav-back:hover { background: var(--accent-pl); color: var(--accent-dk); }

    /* PAGE HERO */
    .page-hero {
      background: linear-gradient(135deg, #e8f5ec 0%, #f0faf2 60%, #f7f9f7 100%);
      border-bottom: 1px solid rgba(143,191,154,.2);
      padding: 4rem 2rem 3.5rem;
      text-align: center;
    }
    .page-hero .eyebrow {
      display: block; font-size: .67rem; font-weight: 600;
      letter-spacing: .22em; text-transform: uppercase;
      color: var(--accent-dk); margin-bottom: .7rem;
    }
    .page-hero h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 300;
      color: #2e4a32; line-height: 1.4;
    }
    .page-hero h1 strong { color: var(--accent-dk); font-weight: 500; }
    .breadcrumb {
      font-size: .72rem; color: var(--text-lt); margin-top: 1.2rem;
    }
    .breadcrumb a { color: var(--accent-dk); text-decoration: none; }

    /* SECTION */
    .sec { padding: 5rem 2rem; }
    .sec-inner { max-width: 900px; margin: 0 auto; }
    .eyebrow {
      display: block; font-size: .67rem; font-weight: 600;
      letter-spacing: .22em; text-transform: uppercase;
      color: var(--accent-dk); margin-bottom: .65rem;
    }
    .sec-heading {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 300;
      line-height: 1.4; color: var(--heading); margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(143,191,154,.25);
    }
    .sec-heading strong { color: var(--accent-dk); font-weight: 500; }
    .body-text {
      font-size: .93rem; line-height: 2.1; color: var(--text-lt); font-weight: 300;
    }

    /* DIVIDER */
    .sec-divider {
      border: none; border-top: 1px solid rgba(143,191,154,.2);
      margin: 0;
    }

    /* 代表挨拶 */
    .greeting-wrap {
      display: grid; grid-template-columns: 1fr; gap: 3rem; align-items: start;
      background: #fff; border-radius: 20px; padding: 2.8rem 3rem;
      border: 1px solid rgba(143,191,154,.2); margin-top: 0;
    }
    .greeting-body { font-size: .9rem; line-height: 2.2; color: var(--text-lt); font-weight: 300; }
    .greeting-body p { margin-bottom: 1.3rem; }
    .greeting-body p:last-child { margin-bottom: 0; }
    .greeting-sig {
      font-size: .8rem; color: var(--text-lt); margin-top: 1.8rem; line-height: 2;
      border-top: 1px solid rgba(143,191,154,.2); padding-top: 1.2rem;
    }
    .greeting-sig span { font-size: 1rem; color: var(--text); font-weight: 500; font-family: 'Noto Serif JP', serif; display: block; }

    /* 理念・ビジョン */
    .vision-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem;
    }
    .vision-card {
      background: #fff; border-radius: 18px; padding: 2.2rem 1.8rem;
      border: 1px solid rgba(143,191,154,.2); border-top: 3px solid var(--accent);
    }
    .vision-icon { font-size: 2rem; margin-bottom: .8rem; display: block; }
    .vision-label { font-size: .62rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-dk); margin-bottom: .4rem; }
    .vision-title { font-family: 'Noto Serif JP', serif; font-size: 1rem; font-weight: 400; color: #2e4a32; margin-bottom: .7rem; line-height: 1.6; }
    .vision-body { font-size: .82rem; line-height: 1.95; color: var(--text-lt); font-weight: 300; }

    /* 会社概要 */
    .company-wrap {
      background: #fff; border-radius: 18px; overflow: hidden;
      border: 1px solid rgba(143,191,154,.2);
    }
    .company-table { width: 100%; border-collapse: collapse; }
    .company-table th {
      width: 160px; padding: 1.1rem 1.5rem; text-align: left;
      font-size: .8rem; font-weight: 600; color: var(--accent-dk);
      background: rgba(143,191,154,.07);
      border-bottom: 1px solid rgba(143,191,154,.15);
      vertical-align: top; white-space: nowrap;
    }
    .company-table td {
      padding: 1.1rem 1.5rem; font-size: .9rem; color: var(--text);
      font-weight: 300; line-height: 1.85;
      border-bottom: 1px solid rgba(143,191,154,.15);
    }
    .company-table tr:last-child th,
    .company-table tr:last-child td { border-bottom: none; }

    /* CTA */
    .about-cta {
      background: var(--bg-sec); border-top: 1px solid rgba(143,191,154,.25);
      padding: 4rem 2rem; text-align: center;
    }
    .about-cta-inner { max-width: 600px; margin: 0 auto; }
    .about-cta h2 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.3rem,2.8vw,1.9rem); font-weight: 300;
      color: #2e4a32; margin-bottom: .8rem;
    }
    .about-cta p { font-size: .9rem; color: var(--text-lt); line-height: 1.9; margin-bottom: 2rem; }
    .btn-solid {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .9rem 2.4rem; border-radius: 980px;
      background: var(--accent); color: #fff;
      font-size: .95rem; font-weight: 500; text-decoration: none;
      transition: background .2s, transform .15s;
    }
    .btn-solid:hover { background: var(--accent-dk); transform: scale(1.02); }
    .btn-outline {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .9rem 2.4rem; border-radius: 980px;
      border: 1.5px solid var(--accent); color: var(--accent-dk);
      font-size: .95rem; font-weight: 500; text-decoration: none; background: transparent;
      transition: background .2s, transform .15s; margin-left: .8rem;
    }
    .btn-outline:hover { background: var(--accent-pl); transform: scale(1.02); }

    /* FOOTER */
    footer {
      background: #2e4a32; padding: 1.2rem 2.5rem;
      border-top: 1px solid rgba(143,191,154,.15);
    }
    .footer-top {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 900px; margin: 0 auto; padding-bottom: 1rem;
      border-bottom: 1px solid rgba(143,191,154,.15);
    }
    .footer-logo { font-family: 'Noto Serif JP', serif; font-size: 1rem; font-weight: 400; color: rgba(255,255,255,.5); display: flex; align-items: center; gap: .5rem; }
    .footer-copy { font-size: .65rem; color: rgba(255,255,255,.3); text-align: center; max-width: 900px; margin: 1rem auto 0; }

    /* REVEAL */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .65s ease, transform .65s ease; }
    .reveal.on { opacity: 1; transform: translateY(0); }

    /* RESPONSIVE */
    @media (max-width: 760px) {
      nav { padding: 0 1.2rem; }
      .nav-logo { font-size: .95rem; }
      .sec { padding: 3.5rem 1.2rem; }
      .greeting-wrap { grid-template-columns: 1fr; gap: 1.5rem; padding: 2rem 1.5rem; }
      .vision-grid { grid-template-columns: 1fr; }
      .company-table th { width: 110px; padding: .9rem 1rem; }
      .company-table td { padding: .9rem 1rem; font-size: .84rem; }
      .about-cta { padding: 3rem 1.2rem; }
      .btn-outline { margin-left: 0; margin-top: .6rem; }
      .about-cta .btn-wrap { display: flex; flex-direction: column; align-items: center; gap: .6rem; }
      footer { padding: 1.2rem 1.4rem; }
    }
    @media (max-width: 480px) {
      .page-hero { padding: 3rem 1.2rem 2.5rem; }
    }
  
    /* 記事本文 */
    .article { max-width: 760px; margin: 0 auto; }
    .article h2 {
      font-family: 'Noto Serif JP', serif; font-size: 1.35rem; font-weight: 500;
      color: #3a5c3e; margin: 3rem 0 1rem; padding-left: .9rem;
      border-left: 4px solid var(--accent); line-height: 1.6;
    }
    .article h3 { font-size: 1.02rem; font-weight: 500; color: var(--accent-dk); margin: 2rem 0 .6rem; }
    .article p { font-size: .93rem; line-height: 2.1; color: var(--text); margin: .9rem 0; font-weight: 300; }
    .article strong { font-weight: 500; color: #3a5c3e; }
    .article ul, .article ol { margin: 1rem 0 1rem 1.4rem; }
    .article li { font-size: .93rem; line-height: 2; color: var(--text); font-weight: 300; margin: .3rem 0; }
    .article table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: .86rem; }
    .article th { background: var(--accent); color: #fff; padding: .7rem .9rem; text-align: left; font-weight: 500; }
    .article td { border: 1px solid rgba(143,191,154,.3); padding: .7rem .9rem; font-weight: 300; }
    .article tr:nth-child(even) td { background: #f7fbf8; }
    .article blockquote {
      margin: 1.4rem 0; padding: 1.1rem 1.5rem; background: #fff8e8;
      border-left: 4px solid #e0b050; color: #6a5320; border-radius: 0 8px 8px 0;
    }
    .article blockquote p { margin: .3rem 0; font-size: .9rem; }
    .article hr { border: 0; border-top: 1px solid rgba(143,191,154,.3); margin: 2.5rem 0; }
    .article-foot {
      margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(143,191,154,.3);
      display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
    }

    /* 空き状況ブロック */
    .avail-card {
      max-width: 720px; margin: 0 auto; background: #fff;
      border: 1px solid rgba(143,191,154,.35); border-radius: 18px; padding: 2rem 2.2rem;
    }
    .avail-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.2rem; }
    .avail-month { font-family: 'Noto Serif JP', serif; font-size: 1.15rem; font-weight: 500; color: #3a5c3e; }
    .avail-upd { font-size: .7rem; color: var(--text-lt); }
    .avail-table { width: 100%; border-collapse: separate; border-spacing: 5px; }
    .avail-table th { font-size: .78rem; font-weight: 400; color: var(--text-lt); padding-bottom: .1rem; }
    .avail-table td { text-align: center; border-radius: 8px; padding: .75rem .2rem; font-size: 1.05rem; }
    .avail-table .rowlab { font-size: .78rem; color: var(--text-lt); width: 3.4rem; text-align: left; background: none; }
    .av-o { background: #e4f3ea; color: #2f6b45; }
    .av-t { background: #fdf3e0; color: #8a6320; }
    .av-x { background: #f3f0ee; color: #8a8580; }
    .av-s { background: #eaf2fa; color: #2a5c8a; font-size: .85rem; }
    .avail-legend { font-size: .72rem; color: var(--text-lt); margin-top: .7rem; }
    .avail-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .8rem;
      margin-top: 1.3rem; padding-top: 1.1rem; border-top: 1px solid rgba(143,191,154,.28); }
    .avail-note { font-size: .8rem; color: var(--text-lt); font-weight: 300; }
    .avail-tel { font-size: 1.05rem; font-weight: 500; color: var(--accent-dk); text-decoration: none; letter-spacing: .02em; }
    @media (max-width: 600px) {
      .avail-card { padding: 1.5rem 1.1rem; }
      .avail-table td { font-size: .95rem; padding: .6rem .1rem; }
      .avail-table .rowlab { width: 2.6rem; font-size: .72rem; }
      .av-s { font-size: .72rem; }
    }

    /* ── お知らせ一覧（news-data.js から自動生成） ── */
    .topnews-list { max-width: 760px; margin: 0 auto; }
    .topnews-item {
      display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
      padding: 1.25rem .5rem; text-decoration: none; color: var(--text);
      border-bottom: 1px solid rgba(143,191,154,.28); transition: background .2s;
    }
    .topnews-item:first-child { border-top: 1px solid rgba(143,191,154,.28); }
    .topnews-item:hover { background: #fff; }
    .topnews-date { font-size: .73rem; color: var(--text-lt); white-space: nowrap; letter-spacing: .05em; }
    .topnews-cat {
      font-size: .67rem; padding: .16rem .68rem; border-radius: 20px; white-space: nowrap;
      background: var(--accent-pl); color: #4a7a55;
    }
    .topnews-cat.c-oshirase { background:#e6f1fb; color:#2a5c8a; }
    .topnews-cat.c-renkei   { background:#fdf1de; color:#8a6320; }
    .topnews-cat.c-kisetsu  { background:#e4f3ea; color:#3d7a51; }
    .topnews-cat.c-station  { background:#fbeaf0; color:#8a4a63; }
    .topnews-title { font-size: .97rem; font-weight: 400; line-height: 1.7; color: #3a5c3e; flex: 1 1 240px; }
    .topnews-item:hover .topnews-title { color: var(--accent-dk); text-decoration: underline; }
    @media (max-width: 560px) {
      .topnews-item { gap: .6rem; padding: 1rem .2rem; }
      .topnews-title { flex-basis: 100%; font-size: .9rem; }
    }

  </style>
  <script src="../analytics.js"></script>
</head>
<body>
<nav>
  <a href="../index.html" class="nav-logo">
    <img src="../logo.png" alt="フィルケア" class="nav-logo-img" onerror="this.style.display='none'">訪問看護ステーション フィルケア
  </a>
  <a href="../index.html" class="nav-back">← トップに戻る</a>
</nav>

<div class="page-hero">
  <span class="eyebrow">訪問看護ステーション フィルケア</span>
  <h1>お知らせ</h1>
  <p class="breadcrumb"><a href="../index.html">トップ</a> &rsaquo; お知らせ</p>
</div>

<section class="sec" style="background:var(--bg)">
  <div class="sec-inner">
    <!-- 一覧は news-data.js から自動生成されます。編集は news-data.js で行ってください。 -->
    <div class="topnews-list reveal" id="newslist"></div>

  </div>
</section>

<section class="sec" style="background:var(--bg-sec)">
  <div class="sec-inner sec-center">
    <h2 class="heading reveal">現在の空き状況は<strong>トップページ</strong>に掲載しています</h2>
    <p class="body-text center reveal">曜日ごとの新規受け入れ状況を毎月更新しています。ケアマネジャー・退院支援ご担当の方はこちらをご確認ください。</p>
    <div class="btn-wrap reveal" style="margin-top:2rem">
      <a href="../index.html#availability" class="btn-solid">空き状況を見る</a>
      <a href="tel:0774468711" class="btn-outline">お電話で相談する</a>
    </div>
  </div>
</section>
<footer>
  <div class="footer-top">
    <span class="footer-logo">
      <img src="../logo.png" alt="" style="height:22px;width:auto;object-fit:contain;opacity:.7" onerror="this.style.display='none'">訪問看護ステーション フィルケア
    </span>
  </div>
  <p class="footer-copy">© 2026 訪問看護ステーション フィルケア. All rights reserved.</p>
</footer>
<script>
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
<script src="../news-data.js"></script>
<script>fillcareRenderNews("newslist", { prefix: "../", itemClass: "topnews" });</script>
</body>
